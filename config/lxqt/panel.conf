[General]
__userfile__=true
iconTheme=
panels=panel1

[panel1]
alignment=-1
animation-duration=0
background-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
hidable=false
hide-on-overlap=false
iconSize=22
lineCount=1
lockPanel=true
opacity=100
panelSize=44
plugins=fancymenu, desktopswitch, quicklaunch, taskbar, spacer, statusnotifier, mount, temp, watts, eco, worldclock, showdesktop
position=Bottom
reserve-space=true
show-delay=0
visible-margin=true
width=100
width-percent=true

[fancymenu]
alignment=Left
autoSel=true
autoSelDelay=150
filterClear=true
icon=@HOME@/.local/share/plasma-themer/current/menu-icon.svg
ownIcon=true
type=fancymenu

[desktopswitch]
alignment=Left
labelType=0
rows=2
showOnlyActive=false
type=desktopswitch

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/org.kde.konsole.desktop
apps\2\desktop=/usr/share/applications/firefox.desktop
apps\3\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\size=3
type=quicklaunch

[taskbar]
alignment=Left
buttonHeight=100
buttonStyle=Icon
buttonWidth=48
closeOnMiddleClick=true
cycleOnWheelScroll=true
groupingEnabled=false
iconByClass=true
raiseOnCurrentDesktop=true
showGroupOnHover=true
showOnlyOneDesktopTasks=false
type=taskbar

[spacer]
alignment=Left
expandable=true
spaceType=invisible
type=spacer

[statusnotifier]
alignment=Right
attentionPeriod=5
autoHide=false
type=statusnotifier

[mount]
alignment=Right
newDeviceAction=showInfo
type=mount

[temp]
alignment=Right
autoRotate=true
command=@HOME@/.local/bin/panelstat temp
maxWidth=100
repeat=true
repeatTimer=5
runWithBash=false
text=%1
tooltip=CPU package temperature
type=customcommand

[watts]
alignment=Right
autoRotate=true
click=lxqt-config-powermanagement
command=@HOME@/.local/bin/panelstat watts
maxWidth=200
repeat=true
repeatTimer=5
runWithBash=false
text=%1
tooltip=Whole laptop power (battery; + = charging) and CPU package power
type=customcommand

[eco]
alignment=Right
autoRotate=true
click=/usr/local/bin/ultra-low-power toggle
command=@HOME@/.local/bin/panelstat eco
maxWidth=120
repeat=true
repeatTimer=5
runWithBash=false
text=%1
tooltip=Ultra low power (click to toggle, Super+Shift+U)
type=customcommand

[worldclock]
alignment=Right
autoRotate=true
customFormat='<b>'HH:mm'</b>'  ddd d MMM
formatType=custom
showTooltip=true
showWeekNumber=true
timeZones\1\timeZone=local
timeZones\size=1
type=worldclock

[showdesktop]
alignment=Right
type=showdesktop
